name: Update combined stars
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_stars.py
      - .github/workflows/update-stars.yml
permissions:
  contents: write
concurrency:
  group: combined-stars
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'SIAT-INVS/CarlaFLCAV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            scripts
            docs/assets
      - name: Fetch both repository counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stars.py
      - name: Commit updated badge and snapshot
        run: |
          git add docs/assets/stars.json docs/assets/combined-stars.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: refresh combined GitHub stars"
          git pull --rebase origin main
          git push origin HEAD:main
